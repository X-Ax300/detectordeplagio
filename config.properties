# PlagDetect Configuration File
# Usage Limits Configuration

# Guest User Limits (Users not logged in)
GUEST_TEXT_PLAGIARISM_LIMIT=3
GUEST_CODE_PLAGIARISM_LIMIT=2
GUEST_AUDIO_TRANSCRIPTION_LIMIT=1
GUEST_TEXT_SUMMARY_LIMIT=5

# Free User Limits (Logged in users without subscription)
FREE_TEXT_PLAGIARISM_LIMIT=10
FREE_CODE_PLAGIARISM_LIMIT=5
FREE_AUDIO_TRANSCRIPTION_LIMIT=3
FREE_TEXT_SUMMARY_LIMIT=15

# Premium User Limits (Users with active subscription)
# Premium users have unlimited access to all features
PREMIUM_UNLIMITED=true

# API Keys for AI Services
# Add your API keys here

# OpenAI API Key (for text analysis, summarization, code analysis)
OPENAI_API_KEY=your_openai_api_key_here

# Groq API Key (alternative for fast inference)
GROQ_API_KEY=your_groq_api_key_here

# AssemblyAI API Key (for audio transcription)
ASSEMBLYAI_API_KEY=your_assemblyai_api_key_here

# Feature Configuration
ENABLE_TEXT_PLAGIARISM=true
ENABLE_CODE_PLAGIARISM=true
ENABLE_AUDIO_TRANSCRIPTION=true
ENABLE_TEXT_SUMMARY=true

# Reset Schedule
# Limits reset daily at midnight (user's local time)
LIMITS_RESET_SCHEDULE=daily
